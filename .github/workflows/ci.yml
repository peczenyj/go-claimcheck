name: CI

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25', '1.26' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@latest

    - name: Run Tests
      run: task test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x

    - name: Run Linter
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
