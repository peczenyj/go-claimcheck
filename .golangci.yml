version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - misspell
    - revive
    - unconvert
    # Enabled by default in v2: errcheck, govet, ineffassign, staticcheck, unused

formatters:
  enable:
    - gofmt
    - goimports
    - gci

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck

formatters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/peczenyj/go-claimcheck)
  gofmt:
    simplify: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
